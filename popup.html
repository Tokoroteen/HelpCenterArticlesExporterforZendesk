<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Help Center Articles Exporter for Zendesk</title>
  <style>
    body {
      font-family: sans-serif;
      width: 220px;
      padding: 12px;
    }
    fieldset {
      border: none;
      margin: 0;
      padding: 0;
    }
    legend {
      font-size: 12px;
      margin-bottom: 6px;
    }
    .format-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .format-option input {
      margin: 0;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 20px;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <fieldset>
    <legend>Format</legend>
    <label class="format-option">
      <input type="radio" name="exportFormat" value="csv" checked />
      CSV
    </label>
    <label class="format-option">
      <input type="radio" name="exportFormat" value="markdown" />
      Markdown
    </label>
  </fieldset>
  <button id="exportBtn">Export articles</button>
  <div id="status">Ready</div>
  <script src="popup.js"></script>
</body>
</html>
